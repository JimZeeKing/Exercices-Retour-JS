<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <header>
      <h1>Exercice 13</h1>
      <h2>Convertir Celcius en Farenheit (implémentation de formule)</h2>
    </header>

    <main>
      <p>Fichier <b>main.js</b> : Convertir les degrés celsius en Fahrenheit en utilisant la formule : F = (C * 1.8) + 32 et afficher dans #result</p>
      <input id="celsius" type="number" step="1" min="-50" max="300" />
      <button>Convertir en Fahrenheit</button>
      <span id="result"></span>
    </main>
  </body>
